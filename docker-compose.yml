# Ferrite Docker Compose Configuration
#
# Usage:
#   docker compose up -d                    # Start Ferrite only, using the image's own
#                                            # built-in, generated-and-validated config
#   docker compose --profile monitoring up  # Start with Prometheus & Grafana
#   docker compose --profile redis up       # Start with Redis for comparison
#   docker compose --profile all up         # Start everything
#
# Custom runtime config (opt-in):
#   By default no ferrite.toml is mounted, so the container uses the image's
#   own generated, validated config. ferrite.example.toml is NOT guaranteed
#   to load in the packaged binary, so never copy it in directly. Instead,
#   generate a config that is valid for the exact image you're running with
#   that image's own `ferrite init`, then layer the custom-config override
#   on top of this file:
#     mkdir -p ./ferrite-config
#     docker run --rm --entrypoint ferrite -v "$(pwd)/ferrite-config:/etc/ferrite" \
#       ferrite:0.4.0 init --minimal --force -o /etc/ferrite/ferrite.toml -d /var/lib/ferrite/data
#     sed -i.bak 's/^bind = "127\.0\.0\.1"$/bind = "0.0.0.0"/' ./ferrite-config/ferrite.toml && rm -f ./ferrite-config/ferrite.toml.bak
#     cp ./ferrite-config/ferrite.toml ./ferrite.toml
#     docker compose -f docker-compose.yml -f docker/docker-compose.custom-config.yml up -d
#   Or point at a different file without editing the override:
#     FERRITE_CONFIG=./ferrite-config/ferrite.toml docker compose -f docker-compose.yml -f docker/docker-compose.custom-config.yml up -d

services:
  # Primary Ferrite service
  ferrite:
    build:
      context: .
      dockerfile: Dockerfile
    image: ferrite:${FERRITE_VERSION:-0.4.0}
    container_name: ferrite
    hostname: ferrite
    labels:
      org.opencontainers.image.title: "Ferrite"
      org.opencontainers.image.description: "High-performance tiered-storage key-value store"
    ports:
      - "6379:6379"   # Redis protocol port
      - "9090:9090"   # Prometheus metrics endpoint
    volumes:
      - ferrite-data:/var/lib/ferrite/data
    environment:
      - RUST_LOG=${RUST_LOG:-ferrite=info}
      - FERRITE_DATA_DIR=/var/lib/ferrite/data
      - FERRITE_BIND=0.0.0.0
      - FERRITE_METRICS_BIND=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferrite-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ferrite-network
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Optional: Redis for comparison testing
  redis:
    image: redis:7-alpine
    container_name: ferrite-redis-comparison
    hostname: redis
    ports:
      - "6380:6379"   # Exposed on different port to avoid conflicts
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --save 60 1000
      --loglevel warning
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ferrite-network
    profiles:
      - redis
      - all

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ferrite-prometheus
    hostname: prometheus
    ports:
      - "9091:9090"   # Avoid conflict with Ferrite metrics port
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      ferrite:
        condition: service_healthy
    networks:
      - ferrite-network
    profiles:
      - monitoring
      - all

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:10.2.2
    container_name: ferrite-grafana
    hostname: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD environment variable}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - ferrite-network
    profiles:
      - monitoring
      - all

  # Optional: Redis Benchmark tool
  redis-benchmark:
    image: redis:7-alpine
    container_name: ferrite-benchmark
    command: >
      sh -c "sleep 15 &&
             redis-benchmark -h ferrite -p 6379 -t set,get -n 100000 -c 50 -d 256 --csv"
    depends_on:
      ferrite:
        condition: service_healthy
    networks:
      - ferrite-network
    profiles:
      - benchmark

volumes:
  ferrite-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  ferrite-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
