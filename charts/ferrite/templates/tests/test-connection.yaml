apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ferrite.fullname" . }}-test-connection"
  labels:
    {{- include "ferrite.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: redis-cli
      image: redis:7-alpine
      command: ['sh', '-c']
      args:
        - |
          set -e
          {{- if .Values.ferrite.auth.enabled }}
          AUTH_FLAG="-a ${FERRITE_PASSWORD}"
          {{- else }}
          AUTH_FLAG=""
          {{- end }}

          echo "Testing PING..."
          response=$(redis-cli -h {{ include "ferrite.fullname" . }} -p {{ .Values.service.port }} $AUTH_FLAG PING)
          if [ "$response" != "PONG" ]; then
            echo "PING failed: got '$response'"
            exit 1
          fi
          echo "PING: OK"

          echo "Testing SET/GET..."
          redis-cli -h {{ include "ferrite.fullname" . }} -p {{ .Values.service.port }} $AUTH_FLAG SET helm-test "pass"
          response=$(redis-cli -h {{ include "ferrite.fullname" . }} -p {{ .Values.service.port }} $AUTH_FLAG GET helm-test)
          if [ "$response" != "pass" ]; then
            echo "SET/GET failed: got '$response'"
            exit 1
          fi
          echo "SET/GET: OK"

          echo "Cleaning up..."
          redis-cli -h {{ include "ferrite.fullname" . }} -p {{ .Values.service.port }} $AUTH_FLAG DEL helm-test

          echo "All tests passed!"
      {{- if .Values.ferrite.auth.enabled }}
      env:
        - name: FERRITE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.ferrite.auth.existingSecret | default (printf "%s-auth" (include "ferrite.fullname" .)) }}
              key: password
      {{- end }}
  restartPolicy: Never
