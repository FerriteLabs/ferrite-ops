name: Release Orchestration

# Coordinates releases across all FerriteLabs repositories.
# Triggered by the core ferrite repo's release workflow via repository_dispatch,
# or manually via workflow_dispatch.

on:
  repository_dispatch:
    types: [ferrite-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.4.0)'
        required: true
      sha256:
        description: 'Source tarball SHA256 (optional — computed automatically if empty)'
        required: false
      dry_run:
        description: 'Dry run (log actions without executing)'
        type: boolean
        default: false

jobs:
  # ── Step 1: Validate inputs and compute metadata ─────────────────────────────
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      - name: Compute release metadata
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.client_payload.version || inputs.version }}
          INPUT_SHA256: ${{ github.event.client_payload.sha256 || inputs.sha256 }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          VERSION="${INPUT_VERSION#v}"
          TAG="v${VERSION}"

          if [ -z "$VERSION" ]; then
            echo "::error::No version specified"
            exit 1
          fi

          # Validate semver format
          if ! printf '%s\n' "$VERSION" |
            grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Invalid semver: $VERSION"
            exit 1
          fi
          if ! printf '%s\n' "$REPOSITORY_OWNER" | grep -qE '^[A-Za-z0-9_.-]+$'; then
            echo "::error::Invalid repository owner"
            exit 1
          fi

          # Compute SHA256 if not provided
          if [ -n "$INPUT_SHA256" ]; then
            SHA256="$INPUT_SHA256"
          else
            TARBALL_URL="https://github.com/${REPOSITORY_OWNER}/ferrite/archive/refs/tags/${TAG}.tar.gz"
            SHA256="$(curl -fsSL "$TARBALL_URL" | shasum -a 256 | awk '{print $1}')"
          fi
          SHA256="$(printf '%s' "$SHA256" | tr 'A-F' 'a-f')"
          if ! printf '%s\n' "$SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::SHA256 must be exactly 64 hexadecimal characters"
            exit 1
          fi

          printf 'version=%s\ntag=%s\nsha256=%s\n' \
            "$VERSION" "$TAG" "$SHA256" >> "$GITHUB_OUTPUT"

          echo "::notice::Release v${VERSION} (SHA256: ${SHA256})"

  # ── Step 2: Update Docker image and Helm chart ───────────────────────────────
  update-ops:
    name: Update ferrite-ops
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Update Helm Chart version
        if: ${{ !(inputs.dry_run || false) }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$VERSION" |
            grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Invalid normalized release version"
            exit 1
          fi
          perl -pi -e "s/^version:.*/version: ${VERSION}/" charts/ferrite/Chart.yaml
          perl -pi -e "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/ferrite/Chart.yaml
          perl -pi -e "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/ferrite-sidecar/Chart.yaml
          echo "Updated primary chart version/appVersion and sidecar appVersion to ${VERSION}"

      - name: Create version bump PR
        if: ${{ !(inputs.dry_run || false) }}
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: release v${{ needs.prepare.outputs.version }}"
          body: |
            Automated release coordination for Ferrite v${{ needs.prepare.outputs.version }}.

            ## Changes
            - Updated Helm chart version and appVersion to ${{ needs.prepare.outputs.version }}
            - Updated sidecar chart appVersion to ${{ needs.prepare.outputs.version }} (package version unchanged)

            _Triggered by [release orchestration](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._
          branch: "release/${{ needs.prepare.outputs.version }}"
          labels: release
          commit-message: "chore: bump to v${{ needs.prepare.outputs.version }}"

      - name: Dry run log
        if: ${{ inputs.dry_run || false }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "::notice::[DRY RUN] Would update primary chart version/appVersion and sidecar appVersion to v${VERSION}"

  # ── Step 3: Trigger Homebrew formula update ──────────────────────────────────
  update-homebrew:
    name: Update homebrew-tap
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Homebrew tap update
        if: ${{ !(inputs.dry_run || false) }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256: ${{ needs.prepare.outputs.sha256 }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$VERSION" |
            grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Invalid normalized release version"
            exit 1
          fi
          if ! printf '%s\n' "$SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::Invalid normalized source SHA256"
            exit 1
          fi
          if ! printf '%s\n' "$REPOSITORY_OWNER" | grep -qE '^[A-Za-z0-9_.-]+$'; then
            echo "::error::Invalid repository owner"
            exit 1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CROSS_REPO_TOKEN not set. Skipping homebrew-tap update."
            echo "Manual update required: version=${VERSION}, sha256=${SHA256}"
            exit 0
          fi

          PAYLOAD="$(jq -cn --arg version "$VERSION" --arg sha256 "$SHA256" \
            '{event_type:"ferrite-release",client_payload:{version:$version,sha256:$sha256}}')"
          curl -fsS -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPOSITORY_OWNER}/homebrew-tap/dispatches" \
            --data "$PAYLOAD"

          echo "::notice::Triggered homebrew-tap update for v${VERSION}"

      - name: Dry run log
        if: ${{ inputs.dry_run || false }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "::notice::[DRY RUN] Would trigger homebrew-tap for v${VERSION}"

  # ── Step 4: Trigger documentation site update ────────────────────────────────
  update-docs:
    name: Update ferrite-docs
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docs version update
        if: ${{ !(inputs.dry_run || false) }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$VERSION" |
            grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Invalid normalized release version"
            exit 1
          fi
          if ! printf '%s\n' "$REPOSITORY_OWNER" | grep -qE '^[A-Za-z0-9_.-]+$'; then
            echo "::error::Invalid repository owner"
            exit 1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CROSS_REPO_TOKEN not set. Skipping docs update."
            exit 0
          fi

          PAYLOAD="$(jq -cn --arg version "$VERSION" \
            '{event_type:"ferrite-release",client_payload:{version:$version}}')"
          curl -fsS -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPOSITORY_OWNER}/ferrite-docs/dispatches" \
            --data "$PAYLOAD"

          echo "::notice::Triggered ferrite-docs update for v${VERSION}"

      - name: Dry run log
        if: ${{ inputs.dry_run || false }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "::notice::[DRY RUN] Would trigger ferrite-docs for v${VERSION}"

  # ── Step 5: Trigger SDK and IDE extension updates ────────────────────────────
  update-sdks:
    name: Update SDKs & Extensions
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SDK repository updates
        if: ${{ !(inputs.dry_run || false) }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$VERSION" |
            grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Invalid normalized release version"
            exit 1
          fi
          if ! printf '%s\n' "$OWNER" | grep -qE '^[A-Za-z0-9_.-]+$'; then
            echo "::error::Invalid repository owner"
            exit 1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CROSS_REPO_TOKEN not set. Skipping SDK updates."
            echo "Manual update required for SDKs to version ${VERSION}"
            exit 0
          fi

          # SDK and extension repositories to notify
          REPOS=(
            "vscode-ferrite"
            "jetbrains-ferrite"
            "ferrite-python-sdk"
            "ferrite-go-sdk"
            "ferrite-node-sdk"
            "ferrite-java-sdk"
            "ferrite-dotnet-sdk"
            "ferrite-rust-sdk"
          )

          SUCCEEDED=0
          FAILED=0

          for REPO in "${REPOS[@]}"; do
            echo "Triggering ${REPO} update for v${VERSION}..."
            PAYLOAD="$(jq -cn --arg version "$VERSION" \
              '{event_type:"ferrite-release",client_payload:{version:$version}}')"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${OWNER}/${REPO}/dispatches" \
              --data "$PAYLOAD")

            if [ "$HTTP_CODE" = "204" ]; then
              echo "::notice::Triggered ${REPO} update for v${VERSION}"
              SUCCEEDED=$((SUCCEEDED + 1))
            else
              echo "::warning::Failed to trigger ${REPO} (HTTP ${HTTP_CODE}). Repository may not exist or may not accept dispatches."
              FAILED=$((FAILED + 1))
            fi
          done

          echo "SDK updates triggered: ${SUCCEEDED} succeeded, ${FAILED} failed"

      - name: Dry run log
        if: ${{ inputs.dry_run || false }}
        run: |
          echo "::notice::[DRY RUN] Would trigger SDK updates for: vscode-ferrite, jetbrains-ferrite, ferrite-python-sdk, ferrite-go-sdk, ferrite-node-sdk, ferrite-java-sdk, ferrite-dotnet-sdk, ferrite-rust-sdk"

  # ── Step 6: Run version sync check ──────────────────────────────────────────
  verify:
    name: Version Sync Check
    needs: [prepare, update-ops, update-homebrew, update-docs, update-sdks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report orchestration results
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256: ${{ needs.prepare.outputs.sha256 }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          UPDATE_OPS_RESULT: ${{ needs.update-ops.result }}
          UPDATE_HOMEBREW_RESULT: ${{ needs.update-homebrew.result }}
          UPDATE_DOCS_RESULT: ${{ needs.update-docs.result }}
          UPDATE_SDKS_RESULT: ${{ needs.update-sdks.result }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$VERSION" |
            grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Invalid normalized release version"
            exit 1
          fi
          if ! printf '%s\n' "$SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::Invalid normalized source SHA256"
            exit 1
          fi
          {
            echo "## Release Orchestration Summary — v${VERSION}"
            echo ""
            echo "| Repository | Status |"
            echo "|-----------|--------|"
            echo "| ferrite-ops (Helm) | ${UPDATE_OPS_RESULT} |"
            echo "| homebrew-tap | ${UPDATE_HOMEBREW_RESULT} |"
            echo "| ferrite-docs | ${UPDATE_DOCS_RESULT} |"
            echo "| SDKs & Extensions | ${UPDATE_SDKS_RESULT} |"
            echo ""
            echo "**Version:** ${VERSION}"
            echo "**SHA256:** ${SHA256}"
            echo "**Dry Run:** ${DRY_RUN}"
          } >> "$GITHUB_STEP_SUMMARY"
