name: Release

on:
  push:
    tags: ['v*']
  repository_dispatch:
    types: [ferrite-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Ferrite release version (e.g. v0.4.0 or 0.4.0)'
        required: true
        default: 'v0.4.0'

# NOTE: this workflow only builds, signs, and publishes the Ferrite image.
# Chart, Dockerfile-default, Compose, GitOps, Terraform, and packaging pin
# updates are handled exclusively by version-sync.yml, which is triggered by
# the same `ferrite-release` repository_dispatch event core emits — keeping
# exactly one workflow responsible for that comprehensive update instead of
# a second, partial chart-only bump racing it.
#
# Release model (two decoupled phases):
#   1. build-and-push — builds the multi-arch image and pushes ONLY the exact,
#      immutable version tag (e.g. `0.4.1`) plus its digest. Exact tags are
#      unique per version, so this expensive multi-arch build is NOT serialized
#      and many releases can build concurrently without racing each other.
#   2. promote-stable — a cheap, serialized digest-promotion job that advances
#      the floating `latest`, `<major>`, and `<major>.<minor>` tags to the
#      freshly built digest with `docker buildx imagetools`, but only when the
#      candidate is >= the current promoted stable version (read from
#      trustworthy registry metadata, never from workflow input). This prevents
#      an older, retried, or out-of-order stable release from overwriting the
#      floating tags, while remaining compatible with imagetools/cosign because
#      promotion only adds tags to the already-signed digest.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ferrite
  DOCKERHUB_IMAGE: ferritelabs/ferrite

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      version: ${{ steps.release_meta.outputs.version }}
      major: ${{ steps.release_meta.outputs.major }}
      major_minor: ${{ steps.release_meta.outputs.major_minor }}
      stable: ${{ steps.release_meta.outputs.stable }}
      dockerhub_enabled: ${{ steps.dockerhub.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Hub publishing eligibility
        id: dockerhub
        env:
          DOCKERHUB_ENABLED: ${{ vars.DOCKERHUB_ENABLED }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          ENABLED=false
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              ENABLED=true
            else
              echo "::warning::DOCKERHUB_ENABLED is true, but Docker Hub credentials are not fully configured; publishing GHCR only."
            fi
          fi
          echo "enabled=${ENABLED}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: steps.dockerhub.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Determine the Ferrite source version to bake into this image, from
      # whichever trigger fired this workflow, and its verified source
      # tarball checksum. This is passed explicitly to the Docker build
      # below via FERRITE_VERSION/FERRITE_SOURCE_SHA256 build-args rather
      # than relying on the Dockerfile's pinned defaults, so that release
      # images are always built from the exact version this workflow run
      # is releasing.
      - name: Determine release version and source checksum
        id: release_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          WORKFLOW_TAG: ${{ inputs.tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          RAW_VERSION=""
          case "$EVENT_NAME" in
            push)
              # Triggered by a `v*` tag push; GITHUB_REF_NAME is the tag itself.
              RAW_VERSION="${GITHUB_REF_NAME}"
              ;;
            repository_dispatch)
              RAW_VERSION="$DISPATCH_VERSION"
              ;;
            workflow_dispatch)
              RAW_VERSION="$WORKFLOW_TAG"
              ;;
            *)
              echo "::error::Unsupported release event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          # Tags/payloads may use either "v0.4.0" or "0.4.0"; normalize.
          VERSION="${RAW_VERSION#v}"

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a Ferrite release version from event '${EVENT_NAME}'."
            exit 1
          fi

          if ! printf '%s\n' "$VERSION" |
            grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Invalid semver version derived for this release: '${VERSION}'"
            exit 1
          fi
          if ! printf '%s\n' "$REPOSITORY_OWNER" | grep -qE '^[A-Za-z0-9_.-]+$'; then
            echo "::error::Invalid repository owner"
            exit 1
          fi

          TARBALL_URL="https://github.com/${REPOSITORY_OWNER}/ferrite/archive/refs/tags/v${VERSION}.tar.gz"
          echo "Computing source archive SHA256 for ${TARBALL_URL} ..."
          SHA256="$(curl -fsSL "$TARBALL_URL" | shasum -a 256 | awk '{print $1}')"
          SHA256="$(printf '%s' "$SHA256" | tr 'A-F' 'a-f')"
          if ! printf '%s\n' "$SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::Failed to obtain a valid SHA256 checksum for the source tarball"
            exit 1
          fi

          echo "::notice::Building Ferrite v${VERSION} (source SHA256: ${SHA256})"

          MAJOR="${VERSION%%.*}"
          MAJOR_MINOR="${VERSION%.*}"
          if [[ "$VERSION" == *-* ]]; then
            STABLE=false
          else
            STABLE=true
          fi

          {
            echo "version=${VERSION}"
            echo "major=${MAJOR}"
            echo "major_minor=${MAJOR_MINOR}"
            echo "stable=${STABLE}"
            echo "build_args<<FERRITE_BUILD_ARGS_EOF"
            printf 'FERRITE_VERSION=%s\n' "$VERSION"
            printf 'FERRITE_SOURCE_SHA256=%s\n' "$SHA256"
            echo "FERRITE_BUILD_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # The build below publishes ONLY the exact, immutable version tag for
      # every trigger and every release channel (stable or prerelease). The
      # floating `latest`, `<major>`, and `<major>.<minor>` tags are NOT built
      # here — they are advanced separately by the serialized promote-stable
      # job, and only when this release is the newest promoted stable version.
      # `latest=false` disables the action's own implicit latest tag so a build
      # can never publish a floating tag out of band.
      - name: Extract metadata (tags, labels) — GHCR
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.release_meta.outputs.version }}

      # Docker Hub is optional: this step (and therefore every Docker Hub
      # tag) only runs when the repository variable DOCKERHUB_ENABLED is
      # explicitly set to 'true' and both login credentials are configured
      # — the same eligibility output that gates the "Log in to Docker Hub"
      # step above. If the variable is unset/false or either credential is
      # missing, this step does not run, steps.meta_dockerhub.outputs.tags
      # is empty, and no Docker Hub tag is generated or pushed.
      - name: Extract metadata (tags, labels) — Docker Hub
        id: meta_dockerhub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.release_meta.outputs.version }}

      # Combine the always-on GHCR tags/labels with the optional Docker Hub
      # tags (empty when meta_dockerhub did not run) into the single tag/
      # label list passed to the build-push step below, so a disabled or
      # missing DOCKERHUB_ENABLED variable never adds a Docker Hub tag.
      - name: Combine registry tags and labels
        id: meta_combined
        env:
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
          GHCR_LABELS: ${{ steps.meta.outputs.labels }}
          DOCKERHUB_TAGS: ${{ steps.meta_dockerhub.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "tags<<FERRITE_META_TAGS_EOF"
            printf '%s\n' "$GHCR_TAGS"
            if [ -n "$DOCKERHUB_TAGS" ]; then
              printf '%s\n' "$DOCKERHUB_TAGS"
            fi
            echo "FERRITE_META_TAGS_EOF"
            echo "labels<<FERRITE_META_LABELS_EOF"
            printf '%s\n' "$GHCR_LABELS"
            echo "FERRITE_META_LABELS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_combined.outputs.tags }}
          labels: ${{ steps.meta_combined.outputs.labels }}
          build-args: ${{ steps.release_meta.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # --- Supply Chain Security ---

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image with Cosign (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Generate SBOM with anchore/sbom-action
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-spdx.json
          upload-artifact: true

      - name: Attach SBOM to container image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attach sbom \
            --sbom sbom-spdx.json \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest SBOM with Cosign (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom-spdx.json \
            --type spdxjson \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  verify:
    name: Verify Signatures & Attestations
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify container signature
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          CERTIFICATE_IDENTITY_REGEXP: ^https://github\.com/${{ github.repository_owner }}/
        run: |
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="$CERTIFICATE_IDENTITY_REGEXP" \
            "${IMAGE}@${DIGEST}"

      - name: Verify SBOM attestation
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          CERTIFICATE_IDENTITY_REGEXP: ^https://github\.com/${{ github.repository_owner }}/
        run: |
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="$CERTIFICATE_IDENTITY_REGEXP" \
            "${IMAGE}@${DIGEST}"

  smoke-test:
    name: Smoke Test Published Image
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Pull and test image
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          docker run -d --name ferrite-smoke -p 6399:6379 "${IMAGE}@${DIGEST}"
          sleep 5
          # Verify server responds to PING
          echo "PING" | nc -q 1 localhost 6399 | grep -q "PONG" || \
            (echo "Smoke test failed: PING did not return PONG" && exit 1)
          echo "Smoke test passed"
          docker stop ferrite-smoke

  # ── Serialized floating-tag promotion ────────────────────────────────────────
  # Advances the floating `latest`, `<major>`, and `<major>.<minor>` tags to
  # this release's digest — but only for stable releases, and only when this
  # release is >= the current promoted stable version. The concurrency group
  # serializes promotions across all release runs so a read-compare-write can
  # never race; combined with the >= gate below, an older, retried, or
  # out-of-order stable release can never regress a floating tag. Prereleases
  # are published as exact tags only and never reach this job.
  promote-stable:
    name: Promote Floating Tags
    runs-on: ubuntu-latest
    needs: [build-and-push, verify, smoke-test]
    if: needs.build-and-push.outputs.stable == 'true'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ferrite-floating-tag-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: needs.build-and-push.outputs.dockerhub_enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The current promoted stable version is whatever `latest` currently
      # points at. Read its baked-in version label directly from the registry
      # (trustworthy registry metadata) — never from workflow input, which a
      # client payload could forge. A missing `latest` means this is the first
      # promotion; any other read failure aborts rather than promoting blindly.
      - name: Resolve current promoted stable version
        id: current
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          CURRENT=""
          ERR_LOG="$(mktemp)"
          trap 'rm -f "$ERR_LOG"' EXIT
          if RAW="$(docker buildx imagetools inspect "${GHCR_IMAGE}:latest" \
            --format '{{json .Image}}' 2>"$ERR_LOG")"; then
            # `.Image` is a single config object for a single-arch image, or a
            # map of platform -> config for a multi-arch image. Read the
            # org.opencontainers.image.version label from either shape.
            CURRENT="$(printf '%s' "$RAW" | jq -r '
              if type == "object" and has("config") then
                (.config.Labels["org.opencontainers.image.version"] // "")
              elif type == "object" then
                ([.[] | .config.Labels["org.opencontainers.image.version"] // empty] | (.[0] // ""))
              else "" end')"
            if [ -z "$CURRENT" ]; then
              echo "::error::latest exists but exposes no readable version label; refusing to promote blindly"
              exit 1
            fi
            if ! printf '%s\n' "$CURRENT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::latest reports a non-stable version label: ${CURRENT}"
              exit 1
            fi
            echo "::notice::Current promoted stable version is ${CURRENT}"
          elif grep -qiE 'not found|manifest unknown|no such manifest|MANIFEST_UNKNOWN' "$ERR_LOG"; then
            echo "::notice::No existing latest tag; treating this as the first promotion."
          else
            echo "::error::Could not determine the current promoted stable version:"
            cat "$ERR_LOG" >&2
            exit 1
          fi

          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"

      # Add the floating tags to the already-built, already-signed digest with
      # imagetools (no rebuild). Because the tags reference the exact same
      # digest, the existing cosign signature and attestations remain valid for
      # them. Skips cleanly when the candidate is older than the current
      # promoted stable version, so a late release never regresses `latest`.
      - name: Promote floating tags to this digest
        env:
          CANDIDATE: ${{ needs.build-and-push.outputs.version }}
          CURRENT_PROMOTED: ${{ steps.current.outputs.version }}
          MAJOR: ${{ needs.build-and-push.outputs.major }}
          MAJOR_MINOR: ${{ needs.build-and-push.outputs.major_minor }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          DOCKERHUB_ENABLED: ${{ needs.build-and-push.outputs.dockerhub_enabled }}
          ORDER_SCRIPT: scripts/release-ordering.sh
        run: |
          set -euo pipefail

          if ! printf '%s\n' "$CANDIDATE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to promote a non-stable candidate: ${CANDIDATE}"
            exit 1
          fi

          if [ -n "$CURRENT_PROMOTED" ] && ! bash "$ORDER_SCRIPT" ge "$CANDIDATE" "$CURRENT_PROMOTED"; then
            echo "::notice::Skipping floating-tag promotion: candidate ${CANDIDATE} is older than the current promoted stable version ${CURRENT_PROMOTED}."
            exit 0
          fi

          promote_registry() {
            local image="$1"
            echo "::notice::Promoting latest/${MAJOR}/${MAJOR_MINOR} -> ${image}@${DIGEST}"
            docker buildx imagetools create \
              --tag "${image}:latest" \
              --tag "${image}:${MAJOR}" \
              --tag "${image}:${MAJOR_MINOR}" \
              "${image}@${DIGEST}"
          }

          promote_registry "$GHCR_IMAGE"
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            promote_registry "$DOCKERHUB_IMAGE"
          fi

          echo "::notice::Floating tags now point at ${CANDIDATE} (${DIGEST})."
