name: Release

on:
  push:
    tags: ['v*']
  repository_dispatch:
    types: [ferrite-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Ferrite release version (e.g. v0.4.0 or 0.4.0)'
        required: true
        default: 'v0.4.0'

# NOTE: this workflow only builds, signs, and publishes the Ferrite image.
# Chart, Dockerfile-default, Compose, GitOps, Terraform, and packaging pin
# updates are handled exclusively by version-sync.yml, which is triggered by
# the same `ferrite-release` repository_dispatch event core emits — keeping
# exactly one workflow responsible for that comprehensive update instead of
# a second, partial chart-only bump racing it.
#
# Release model — the exact version tag is immutable end-to-end:
#   0. prepare — the ONE trusted place that derives this run's release
#      version from the triggering event and normalizes it (stripping an
#      optional leading "v") BEFORE any build, scan, sign, or registry write
#      happens. Every job below consumes prepare's validated, normalized
#      `version` output instead of re-deriving it from raw event data. This
#      is deliberately NOT a workflow-level `concurrency:` keyed on the raw
#      event value: a `v1.2.3` tag push and a `1.2.3` workflow_dispatch input
#      describe the exact SAME release but would produce two DIFFERENT raw
#      concurrency-group strings and never serialize against each other.
#      Instead, build-and-push and promote-exact each carry their own
#      job-level `concurrency:` keyed on prepare's normalized version, so
#      any two runs — however differently the version was spelled — that
#      resolve to the same normalized version always queue behind each
#      other rather than racing.
#   1. build-and-push — first checks whether the exact version tag already
#      exists on GHCR (a previous, successful run of this exact version). If
#      it does, its signature and its baked version/source-checksum labels
#      are verified against what this run would publish: a match is treated
#      as an already-complete, idempotent release (no rebuild, no
#      replacement); a mismatch or an unsigned/unverifiable existing tag
#      FAILS the run outright rather than silently diverging from it.
#      Otherwise, this job builds the multi-arch image and pushes ONLY a
#      unique, throwaway CANDIDATE tag (`candidate-<run id>-<run attempt>`)
#      — never the exact version tag itself — then scans it with Trivy,
#      signs it with cosign, and generates/attaches/attests its SBOM and SLSA
#      provenance, all against that candidate tag/digest.
#   2. verify / smoke-test — verify the signature and SBOM attestation and
#      run a live smoke test against the resolved digest (the candidate's, or
#      the pre-existing tag's, in the idempotent case).
#   3. promote-exact — ONLY after every prior job has succeeded, this job
#      promotes that fully verified digest to the real, immutable exact
#      version tag with `docker buildx imagetools create` (no rebuild). It
#      re-checks immediately beforehand whether the exact tag already exists;
#      an existing tag with a matching digest is left alone (idempotent
#      no-op), and one with a *different* digest is refused outright — on
#      GHCR and, independently, on the optional Docker Hub mirror (copied
#      with a real cross-registry blob copy — see the promote-exact job
#      below — and digest-verified after the copy, since `imagetools create`
#      does not reliably copy blob content across DIFFERENT registries).
#      Because promote-exact only runs once build-and-push, verify, and
#      smoke-test have all succeeded, a failed run can never leave an
#      unverified exact tag behind: the exact tag is the LAST thing this
#      workflow ever writes, not the first. The throwaway candidate tag is
#      NOT the exact tag and is left in the registry as a harmless,
#      clearly-named build artifact; registry-level retention/cleanup of
#      candidate-* tags is intentionally out of scope here (see AUDIT.md).
#   4. promote-stable — a cheap, serialized digest-promotion job that
#      independently advances each of the floating `latest`, `<major>`, and
#      `<major>.<minor>` tags to this release's digest, but only for stable
#      releases, and only for the floating tags whose OWN currently promoted
#      version (read from trustworthy registry metadata, never from
#      workflow input) this release is `>=`. Because each floating tag is
#      compared independently, a backport release (e.g. 1.9.1 published after
#      2.0.0) correctly leaves `latest` alone while still advancing `1` and
#      `1.9` if 1.9.1 is newer within that older series.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ferrite
  DOCKERHUB_IMAGE: ferritelabs/ferrite
  # Restricts every keyless cosign verification in this workflow to a
  # signature minted by THIS EXACT repository's THIS EXACT workflow file
  # (.github/workflows/release.yml), on one of the two refs this workflow is
  # actually trusted to release from: a `v*` tag push (the real release
  # trigger), or a dispatch (repository_dispatch from core, or a manual
  # workflow_dispatch) running on `main` — GitHub Actions always executes
  # dispatch events against the repository's default branch, so both
  # dispatch trigger types are covered by the `heads/main` alternative.
  # Deliberately NOT an org-wide regex: this can never match a signature
  # minted by a different repository under the same owner, a fork, a
  # different workflow file in this same repository, or a run on any other
  # ref (a feature branch, a PR head, an arbitrary tag, etc.).
  CERTIFICATE_IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$

jobs:
  # ── Step 0: Derive and validate this run's normalized release version ──────
  # The ONLY place in this workflow that determines the release version from
  # the triggering event, strips an optional leading "v", and validates it
  # (both a loose shape check and the shared strict-SemVer validator). Every
  # other job consumes this job's `version` output instead of re-deriving it
  # from raw event data, and build-and-push/promote-exact each key their own
  # job-level `concurrency:` group on this exact, normalized value — so a
  # `v1.2.3` tag push and a `1.2.3` workflow_dispatch input, which describe
  # the identical release but would otherwise produce two different raw
  # strings, always serialize against each other instead of racing.
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      sha256: ${{ steps.release_meta.outputs.sha256 }}
      major: ${{ steps.release_meta.outputs.major }}
      major_minor: ${{ steps.release_meta.outputs.major_minor }}
      stable: ${{ steps.release_meta.outputs.stable }}
      candidate_tag: ${{ steps.release_meta.outputs.candidate_tag }}
      build_args: ${{ steps.release_meta.outputs.build_args }}
    steps:
      - uses: actions/checkout@v4

      # Determine the Ferrite source version to bake into this image, from
      # whichever trigger fired this workflow, and its verified source
      # tarball checksum. This is passed explicitly to the Docker build
      # below via FERRITE_VERSION/FERRITE_SOURCE_SHA256 build-args rather
      # than relying on the Dockerfile's pinned defaults, so that release
      # images are always built from the exact version this workflow run
      # is releasing. Also derives a unique, throwaway candidate tag for
      # this specific run/attempt — the exact version tag is never pushed
      # directly; it is only ever created later, by promote-exact, from a
      # fully verified candidate digest.
      - name: Determine release version and source checksum
        id: release_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          WORKFLOW_TAG: ${{ inputs.tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ORDER_SCRIPT: scripts/release-ordering.sh
        run: |
          set -euo pipefail

          RAW_VERSION=""
          case "$EVENT_NAME" in
            push)
              # Triggered by a `v*` tag push; GITHUB_REF_NAME is the tag itself.
              RAW_VERSION="${GITHUB_REF_NAME}"
              ;;
            repository_dispatch)
              RAW_VERSION="$DISPATCH_VERSION"
              ;;
            workflow_dispatch)
              RAW_VERSION="$WORKFLOW_TAG"
              ;;
            *)
              echo "::error::Unsupported release event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          # Tags/payloads may use either "v0.4.0" or "0.4.0"; normalize.
          VERSION="${RAW_VERSION#v}"

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a Ferrite release version from event '${EVENT_NAME}'."
            exit 1
          fi

          if ! printf '%s\n' "$VERSION" |
            grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Invalid semver version derived for this release: '${VERSION}'"
            exit 1
          fi
          # Belt-and-suspenders: also run the shared strict-SemVer validator
          # (rejects leading zeros in the core or a numeric pre-release
          # identifier), so a release can never publish a version that the
          # rest of the release/version-sync/supersession tooling would
          # refuse to compare correctly.
          if ! bash "$ORDER_SCRIPT" validate "$VERSION"; then
            echo "::error::Version '${VERSION}' failed strict SemVer validation"
            exit 1
          fi
          if ! printf '%s\n' "$REPOSITORY_OWNER" | grep -qE '^[A-Za-z0-9_.-]+$'; then
            echo "::error::Invalid repository owner"
            exit 1
          fi

          TARBALL_URL="https://github.com/${REPOSITORY_OWNER}/ferrite/archive/refs/tags/v${VERSION}.tar.gz"
          echo "Computing source archive SHA256 for ${TARBALL_URL} ..."
          SHA256="$(curl -fsSL "$TARBALL_URL" | shasum -a 256 | awk '{print $1}')"
          SHA256="$(printf '%s' "$SHA256" | tr 'A-F' 'a-f')"
          if ! printf '%s\n' "$SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::Failed to obtain a valid SHA256 checksum for the source tarball"
            exit 1
          fi

          echo "::notice::Building Ferrite v${VERSION} (source SHA256: ${SHA256})"

          MAJOR="${VERSION%%.*}"
          MAJOR_MINOR="${VERSION%.*}"
          if [[ "$VERSION" == *-* ]]; then
            STABLE=false
          else
            STABLE=true
          fi

          # Unique per run AND per retry attempt: a re-run of a failed
          # attempt gets its own candidate tag rather than reusing one that
          # may have failed mid-build.
          CANDIDATE_TAG="candidate-${RUN_ID}-${RUN_ATTEMPT}"

          {
            echo "version=${VERSION}"
            echo "sha256=${SHA256}"
            echo "major=${MAJOR}"
            echo "major_minor=${MAJOR_MINOR}"
            echo "stable=${STABLE}"
            echo "candidate_tag=${CANDIDATE_TAG}"
            echo "build_args<<FERRITE_BUILD_ARGS_EOF"
            printf 'FERRITE_VERSION=%s\n' "$VERSION"
            printf 'FERRITE_SOURCE_SHA256=%s\n' "$SHA256"
            echo "FERRITE_BUILD_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Docker Image
    needs: prepare
    runs-on: ubuntu-latest
    # Serializes the exact-tag pipeline (this job, and promote-exact below)
    # across ANY run that resolves to this SAME normalized version — however
    # differently its raw input was spelled — so a duplicate/retried/
    # differently-formatted trigger for the same release always queues
    # behind an in-flight one (and then observes it as an idempotent
    # no-op via check_existing) instead of racing it.
    concurrency:
      group: ferrite-release-exact-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.check_existing.outputs.idempotent == 'true' && steps.check_existing.outputs.existing_digest || steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      version: ${{ needs.prepare.outputs.version }}
      major: ${{ needs.prepare.outputs.major }}
      major_minor: ${{ needs.prepare.outputs.major_minor }}
      stable: ${{ needs.prepare.outputs.stable }}
      candidate_tag: ${{ needs.prepare.outputs.candidate_tag }}
      idempotent: ${{ steps.check_existing.outputs.idempotent }}
      dockerhub_enabled: ${{ steps.dockerhub.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Hub publishing eligibility
        id: dockerhub
        env:
          DOCKERHUB_ENABLED: ${{ vars.DOCKERHUB_ENABLED }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          ENABLED=false
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              ENABLED=true
            else
              echo "::warning::DOCKERHUB_ENABLED is true, but Docker Hub credentials are not fully configured; publishing GHCR only."
            fi
          fi
          echo "enabled=${ENABLED}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: steps.dockerhub.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Installed early so it is available both for verifying a pre-existing
      # exact tag below AND for signing a freshly built candidate later.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Checks whether the exact version tag this run would publish ALREADY
      # exists on GHCR from a previous, successful run. If so, its signature
      # and its baked org.opencontainers.image.version / source-sha256
      # labels are verified against this run's version/checksum:
      #   - a full match means this version is already fully published and
      #     verified — idempotent=true, and every build/scan/sign/attest
      #     step below is skipped entirely (no rebuild, no replacement).
      #   - a missing tag means this is the first publish of this exact
      #     version — idempotent=false, proceed to build normally.
      #   - a tag that exists but has different metadata, or that cannot be
      #     verified with cosign, means the existing exact tag is corrupt,
      #     unsigned, or was tampered with — this FAILS the run immediately,
      #     before any build step runs, rather than silently diverging from
      #     (or rebuilding over) a broken published release.
      - name: Check existing exact GHCR tag
        id: check_existing
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          set -euo pipefail

          ERR_LOG="$(mktemp)"
          trap 'rm -f "$ERR_LOG"' EXIT

          RAW_IMAGE=""
          if ! RAW_IMAGE="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .Image}}' 2>"$ERR_LOG")"; then
            if grep -qiE 'not found|manifest unknown|no such manifest|MANIFEST_UNKNOWN' "$ERR_LOG"; then
              echo "::notice::No existing ${GHCR_IMAGE}:${VERSION} tag; this is the first publish of this exact version."
              echo "idempotent=false" >> "$GITHUB_OUTPUT"
              echo "existing_digest=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not inspect the existing ${GHCR_IMAGE}:${VERSION} tag:"
            cat "$ERR_LOG" >&2
            exit 1
          fi

          MANIFEST_DIGEST="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
          if [ -z "$MANIFEST_DIGEST" ]; then
            echo "::error::${GHCR_IMAGE}:${VERSION} exists but its manifest digest could not be determined."
            exit 1
          fi

          # `.Image` is a single config object for a single-arch image, or a
          # map of platform -> config for a multi-arch image; read the
          # relevant labels from either shape.
          EXISTING_VERSION="$(printf '%s' "$RAW_IMAGE" | jq -r '
            if type == "object" and has("config") then
              (.config.Labels["org.opencontainers.image.version"] // "")
            elif type == "object" then
              ([.[] | .config.Labels["org.opencontainers.image.version"] // empty] | (.[0] // ""))
            else "" end')"
          EXISTING_SHA256="$(printf '%s' "$RAW_IMAGE" | jq -r '
            if type == "object" and has("config") then
              (.config.Labels["dev.ferritelabs.image.source-sha256"] // "")
            elif type == "object" then
              ([.[] | .config.Labels["dev.ferritelabs.image.source-sha256"] // empty] | (.[0] // ""))
            else "" end')"

          if [ "$EXISTING_VERSION" != "$VERSION" ] || [ "$EXISTING_SHA256" != "$SHA256" ]; then
            echo "::error::${GHCR_IMAGE}:${VERSION} already exists but its baked metadata does not match this release (existing version='${EXISTING_VERSION}', sha256='${EXISTING_SHA256}'; expected version='${VERSION}', sha256='${SHA256}'). Refusing to silently diverge from, or rebuild over, a mismatched exact tag."
            exit 1
          fi

          if ! cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="$CERTIFICATE_IDENTITY_REGEXP" \
            "${GHCR_IMAGE}@${MANIFEST_DIGEST}" >/dev/null 2>"$ERR_LOG"; then
            echo "::error::${GHCR_IMAGE}:${VERSION} (${MANIFEST_DIGEST}) already exists but its signature could not be verified:"
            cat "$ERR_LOG" >&2
            echo "::error::Refusing to treat an unsigned or unverifiable existing exact tag as safe."
            exit 1
          fi

          echo "::notice::${GHCR_IMAGE}:${VERSION} already exists, is verified, and matches this release exactly; treating as an idempotent no-op (no rebuild, no replacement)."
          echo "idempotent=true" >> "$GITHUB_OUTPUT"
          echo "existing_digest=${MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"

      # The steps below publish ONLY a unique, throwaway candidate tag — the
      # exact, immutable version tag itself is never pushed here; it is only
      # ever created by promote-exact, once every verification step below
      # AND the standalone verify/smoke-test jobs have all succeeded. Every
      # step in this block is skipped entirely when check_existing found an
      # already-verified, matching exact tag (idempotent no-op): no rebuild,
      # no re-signing, no re-attesting.
      # The candidate tag itself is a throwaway, run-specific string
      # (candidate-<run id>-<run attempt>), but the image's baked
      # org.opencontainers.image.version label MUST be the real release
      # SemVer: docker/metadata-action derives that label from the tag list
      # by default, which for a bare `type=raw` tag would otherwise bake the
      # candidate string itself into the label. check_existing's idempotent
      # verification above, and promote-stable's per-tag floating-tag
      # resolution below, both read this exact label back from the registry
      # expecting a real SemVer value — so it is explicitly overridden here
      # rather than left to derive from the candidate tag.
      - name: Extract metadata (tags, labels) — GHCR candidate
        id: meta
        if: steps.check_existing.outputs.idempotent != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      # Docker Hub is optional: this step (and therefore every Docker Hub
      # tag) only runs when the repository variable DOCKERHUB_ENABLED is
      # explicitly set to 'true' and both login credentials are configured
      # — the same eligibility output that gates the "Log in to Docker Hub"
      # step above. If the variable is unset/false or either credential is
      # missing, this step does not run, steps.meta_dockerhub.outputs.tags
      # is empty, and no Docker Hub tag is generated or pushed.
      - name: Extract metadata (tags, labels) — Docker Hub candidate
        id: meta_dockerhub
        if: steps.check_existing.outputs.idempotent != 'true' && steps.dockerhub.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      # Combine the always-on GHCR tags/labels with the optional Docker Hub
      # tags (empty when meta_dockerhub did not run) into the single tag/
      # label list passed to the build-push step below, so a disabled or
      # missing DOCKERHUB_ENABLED variable never adds a Docker Hub tag.
      - name: Combine registry tags and labels
        id: meta_combined
        if: steps.check_existing.outputs.idempotent != 'true'
        env:
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
          GHCR_LABELS: ${{ steps.meta.outputs.labels }}
          DOCKERHUB_TAGS: ${{ steps.meta_dockerhub.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "tags<<FERRITE_META_TAGS_EOF"
            printf '%s\n' "$GHCR_TAGS"
            if [ -n "$DOCKERHUB_TAGS" ]; then
              printf '%s\n' "$DOCKERHUB_TAGS"
            fi
            echo "FERRITE_META_TAGS_EOF"
            echo "labels<<FERRITE_META_LABELS_EOF"
            printf '%s\n' "$GHCR_LABELS"
            echo "FERRITE_META_LABELS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push candidate (amd64 + arm64)
        id: build
        if: steps.check_existing.outputs.idempotent != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_combined.outputs.tags }}
          labels: ${{ steps.meta_combined.outputs.labels }}
          build-args: ${{ needs.prepare.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # --- Supply Chain Security (candidate only) ---

      - name: Scan candidate image with Trivy
        if: steps.check_existing.outputs.idempotent != 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Sign container image with Cosign (keyless OIDC)
        if: steps.check_existing.outputs.idempotent != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Generate SBOM with anchore/sbom-action
        if: steps.check_existing.outputs.idempotent != 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-spdx.json
          upload-artifact: true

      - name: Attach SBOM to container image
        if: steps.check_existing.outputs.idempotent != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attach sbom \
            --sbom sbom-spdx.json \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest SBOM with Cosign (keyless OIDC)
        if: steps.check_existing.outputs.idempotent != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom-spdx.json \
            --type spdxjson \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Generate SLSA provenance attestation
        if: steps.check_existing.outputs.idempotent != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  verify:
    name: Verify Signatures & Attestations
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify container signature
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="$CERTIFICATE_IDENTITY_REGEXP" \
            "${IMAGE}@${DIGEST}"

      - name: Verify SBOM attestation
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="$CERTIFICATE_IDENTITY_REGEXP" \
            "${IMAGE}@${DIGEST}"

  smoke-test:
    name: Smoke Test Published Image
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Pull and test image
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          docker run -d --name ferrite-smoke -p 6399:6379 "${IMAGE}@${DIGEST}"
          sleep 5
          # Verify server responds to PING
          echo "PING" | nc -q 1 localhost 6399 | grep -q "PONG" || \
            (echo "Smoke test failed: PING did not return PONG" && exit 1)
          echo "Smoke test passed"
          docker stop ferrite-smoke

  # ── Promote the verified candidate to the exact, immutable version tag ────
  # Runs ONLY after build-and-push, verify, and smoke-test have all
  # succeeded, so a failed run can never leave an unverified exact tag
  # behind — this job is the ONLY place that ever creates or touches the
  # exact version tag, and it is the last thing this workflow does before
  # promote-stable. It re-checks immediately beforehand whether the exact
  # tag already exists on each registry: a match is left untouched
  # (idempotent no-op), and a different digest is refused outright rather
  # than overwritten.
  promote-exact:
    name: Promote Verified Candidate to Exact Version Tag
    runs-on: ubuntu-latest
    needs: [build-and-push, verify, smoke-test]
    # Same normalized-version group as build-and-push above: any other run
    # (however its input was spelled) that resolves to this exact normalized
    # version queues behind this promotion rather than racing its
    # read-compare-write against an existing exact tag.
    concurrency:
      group: ferrite-release-exact-${{ needs.build-and-push.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: needs.build-and-push.outputs.dockerhub_enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `docker buildx imagetools create` does not reliably copy blob
      # content BETWEEN different registries — it can create a manifest
      # list referencing digests, but the underlying layer/config blobs must
      # already exist in the destination registry. That holds for GHCR (the
      # source digest was pushed there directly) but not necessarily for an
      # optional Docker Hub backfill, so crane — a real, pinned OCI registry
      # client that performs an actual all-platform blob copy — is used
      # instead for that cross-registry case only. Entirely conditional on
      # Docker Hub eligibility, exactly like the login step above.
      - name: Set up crane
        if: needs.build-and-push.outputs.dockerhub_enabled == 'true'
        uses: imjasonh/setup-crane@v0.7
        with:
          version: v0.21.8

      - name: Promote the verified digest to the exact immutable version tag
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          DOCKERHUB_ENABLED: ${{ needs.build-and-push.outputs.dockerhub_enabled }}
        run: |
          set -euo pipefail

          if ! printf '%s\n' "$VERSION" |
            grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Refusing to promote an invalid exact version: ${VERSION}"
            exit 1
          fi
          if ! printf '%s\n' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Refusing to promote an invalid digest: ${DIGEST}"
            exit 1
          fi

          # Promotes DIGEST to "${image}:${VERSION}" on the SAME registry as
          # the verified source (GHCR only) unless that exact tag already
          # exists and points elsewhere, in which case it refuses outright
          # rather than overwriting a different, already-published exact
          # version. An existing tag that already matches DIGEST is left
          # untouched (idempotent no-op) instead of being re-written. Never
          # used cross-registry — see promote_exact_tag_cross_registry below
          # for the Docker Hub backfill, which needs a real blob copy.
          promote_exact_tag() {
            local image="$1"
            local err_log existing_digest
            err_log="$(mktemp)"
            if existing_digest="$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{json .Manifest}}' 2>"$err_log" | jq -r '.digest // empty')" \
              && [ -n "$existing_digest" ]; then
              rm -f "$err_log"
              if [ "$existing_digest" = "$DIGEST" ]; then
                echo "::notice::${image}:${VERSION} already points at ${DIGEST}; nothing to promote (idempotent)."
                return 0
              fi
              echo "::error::${image}:${VERSION} already exists but points at a DIFFERENT digest (${existing_digest} != ${DIGEST}). Refusing to overwrite an existing exact version tag."
              return 1
            fi
            if grep -qiE 'not found|manifest unknown|no such manifest|MANIFEST_UNKNOWN' "$err_log"; then
              rm -f "$err_log"
              echo "::notice::Promoting ${image}:${VERSION} -> ${DIGEST} from verified source ${image}@${DIGEST}"
              docker buildx imagetools create --tag "${image}:${VERSION}" "${image}@${DIGEST}"
              return 0
            fi
            echo "::error::Could not determine whether ${image}:${VERSION} already exists:"
            cat "$err_log" >&2
            rm -f "$err_log"
            return 1
          }

          # Cross-registry Docker Hub backfill: performs a REAL all-platform
          # blob copy with crane (pulling every referenced layer/config from
          # the verified GHCR source and pushing it to Docker Hub, not just
          # referencing a manifest that may not resolve there), then
          # independently re-reads the destination digest and asserts it is
          # BYTE-IDENTICAL to the verified GHCR source digest before treating
          # the promotion as successful. Optional end-to-end: any ambiguous
          # inspection failure is a skipped warning (never fatal), but a
          # genuine digest MISMATCH — whether pre-existing or produced by a
          # corrupt copy — is always fatal; Docker Hub must never overwrite a
          # different existing digest, nor be left pointing at a tag this
          # workflow cannot prove matches the signed, verified source.
          promote_exact_tag_cross_registry() {
            local dest_image="$1" source_image="$2"
            local err_log existing_digest
            err_log="$(mktemp)"
            if existing_digest="$(crane digest "${dest_image}:${VERSION}" 2>"$err_log")" \
              && [ -n "$existing_digest" ]; then
              rm -f "$err_log"
              if [ "$existing_digest" = "$DIGEST" ]; then
                echo "::notice::${dest_image}:${VERSION} already points at ${DIGEST}; nothing to promote (idempotent)."
                return 0
              fi
              echo "::error::${dest_image}:${VERSION} already exists but points at a DIFFERENT digest (${existing_digest} != ${DIGEST}). Refusing to overwrite an existing exact version tag."
              return 1
            fi
            if grep -qiE 'not found|manifest unknown|no such manifest|MANIFEST_UNKNOWN|NAME_UNKNOWN|404' "$err_log"; then
              rm -f "$err_log"
              echo "::notice::Promoting ${dest_image}:${VERSION} -> ${DIGEST} via a real cross-registry blob copy from verified source ${source_image}@${DIGEST}"
              crane copy "${source_image}@${DIGEST}" "${dest_image}:${VERSION}"
              local copied_digest
              copied_digest="$(crane digest "${dest_image}:${VERSION}")"
              if [ "$copied_digest" != "$DIGEST" ]; then
                echo "::error::Cross-registry copy to ${dest_image}:${VERSION} produced digest ${copied_digest}, which does not match the verified source digest ${DIGEST}."
                return 1
              fi
              echo "::notice::Verified ${dest_image}:${VERSION} digest matches the verified GHCR source digest exactly."
              return 0
            fi
            echo "::error::Could not determine whether ${dest_image}:${VERSION} already exists:"
            cat "$err_log" >&2
            rm -f "$err_log"
            echo "::warning::Skipping optional ${dest_image} promotion due to the inspection error above."
            return 0
          }

          promote_exact_tag "$GHCR_IMAGE"

          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            # GHCR is the signed, metadata-verified source of truth. Copying
            # from it also lets an idempotent retry safely backfill Docker
            # Hub when that mirror was disabled during the original release.
            promote_exact_tag_cross_registry "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"
          fi

          echo "::notice::Exact version tag ${VERSION} is now published and verified at ${DIGEST}."

  # ── Serialized floating-tag promotion ────────────────────────────────────
  # Independently advances each of the floating `latest`, `<major>`, and
  # `<major>.<minor>` tags to this release's digest — but only for stable
  # releases, and only for the floating tags whose OWN currently promoted
  # version this release is >=. Each tag's current version is read
  # independently from trustworthy registry metadata (never from workflow
  # input), so a backport release (e.g. 1.9.1 after 2.0.0) correctly leaves
  # `latest` alone (1.9.1 < 2.0.0) while still advancing `1` and `1.9` if
  # 1.9.1 is newer than whatever they currently point at. The concurrency
  # group serializes promotions across all release runs so a
  # read-compare-write can never race; combined with the per-tag `>=` gate,
  # an older, retried, or out-of-order stable release can never regress any
  # floating tag. Prereleases are published as exact tags only and never
  # reach this job.
  promote-stable:
    name: Promote Floating Tags
    runs-on: ubuntu-latest
    needs: [build-and-push, promote-exact]
    if: needs.build-and-push.outputs.stable == 'true'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ferrite-floating-tag-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: needs.build-and-push.outputs.dockerhub_enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Independently resolves the current promoted version behind EACH of
      # the three floating tags, reading each one's baked
      # org.opencontainers.image.version label directly from the registry —
      # never from workflow input. A missing tag means that floating tag has
      # never been promoted; any other read failure aborts rather than
      # promoting blindly.
      - name: Resolve current per-tag promoted versions
        id: current
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          MAJOR: ${{ needs.build-and-push.outputs.major }}
          MAJOR_MINOR: ${{ needs.build-and-push.outputs.major_minor }}
        run: |
          set -euo pipefail

          resolve_tag_version() {
            local tag="$1"
            local raw err_log current=""
            err_log="$(mktemp)"
            if raw="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${tag}" --format '{{json .Image}}' 2>"$err_log")"; then
              current="$(printf '%s' "$raw" | jq -r '
                if type == "object" and has("config") then
                  (.config.Labels["org.opencontainers.image.version"] // "")
                elif type == "object" then
                  ([.[] | .config.Labels["org.opencontainers.image.version"] // empty] | (.[0] // ""))
                else "" end')"
              if [ -n "$current" ] && ! printf '%s\n' "$current" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::${tag} reports a non-stable version label: ${current}" >&2
                rm -f "$err_log"
                exit 1
              fi
            elif grep -qiE 'not found|manifest unknown|no such manifest|MANIFEST_UNKNOWN' "$err_log"; then
              current=""
            else
              echo "::error::Could not determine the current promoted version for tag ${tag}:" >&2
              cat "$err_log" >&2
              rm -f "$err_log"
              exit 1
            fi
            rm -f "$err_log"
            printf '%s' "$current"
          }

          LATEST_CURRENT="$(resolve_tag_version latest)"
          MAJOR_CURRENT="$(resolve_tag_version "$MAJOR")"
          MAJOR_MINOR_CURRENT="$(resolve_tag_version "$MAJOR_MINOR")"

          echo "::notice::Current promoted versions — latest=${LATEST_CURRENT:-<none>}, ${MAJOR}=${MAJOR_CURRENT:-<none>}, ${MAJOR_MINOR}=${MAJOR_MINOR_CURRENT:-<none>}"

          {
            echo "latest=${LATEST_CURRENT}"
            echo "major=${MAJOR_CURRENT}"
            echo "major_minor=${MAJOR_MINOR_CURRENT}"
          } >> "$GITHUB_OUTPUT"

      # Adds the floating tags whose gate passed to the already-built,
      # already-signed digest with imagetools (no rebuild); tags whose own
      # current version is already >= this candidate are skipped
      # independently, which is what lets a backport correctly update only
      # part of the floating-tag set.
      - name: Promote floating tags to this digest
        env:
          CANDIDATE: ${{ needs.build-and-push.outputs.version }}
          MAJOR: ${{ needs.build-and-push.outputs.major }}
          MAJOR_MINOR: ${{ needs.build-and-push.outputs.major_minor }}
          LATEST_CURRENT: ${{ steps.current.outputs.latest }}
          MAJOR_CURRENT: ${{ steps.current.outputs.major }}
          MAJOR_MINOR_CURRENT: ${{ steps.current.outputs.major_minor }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          DOCKERHUB_ENABLED: ${{ needs.build-and-push.outputs.dockerhub_enabled }}
          ORDER_SCRIPT: scripts/release-ordering.sh
        run: |
          set -euo pipefail

          if ! printf '%s\n' "$CANDIDATE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to promote a non-stable candidate: ${CANDIDATE}"
            exit 1
          fi

          # True (exit 0) when this tag has no current promoted version yet,
          # or when CANDIDATE is >= that tag's own current version.
          should_promote() {
            local current="$1"
            [ -z "$current" ] && return 0
            bash "$ORDER_SCRIPT" ge "$CANDIDATE" "$current"
          }

          TAGS=()
          if should_promote "$LATEST_CURRENT"; then
            TAGS+=("latest")
          else
            echo "::notice::Skipping 'latest': candidate ${CANDIDATE} is not newer than the currently promoted ${LATEST_CURRENT}."
          fi
          if should_promote "$MAJOR_CURRENT"; then
            TAGS+=("$MAJOR")
          else
            echo "::notice::Skipping '${MAJOR}': candidate ${CANDIDATE} is not newer than the currently promoted ${MAJOR_CURRENT}."
          fi
          if should_promote "$MAJOR_MINOR_CURRENT"; then
            TAGS+=("$MAJOR_MINOR")
          else
            echo "::notice::Skipping '${MAJOR_MINOR}': candidate ${CANDIDATE} is not newer than the currently promoted ${MAJOR_MINOR_CURRENT}."
          fi

          if [ ${#TAGS[@]} -eq 0 ]; then
            echo "::notice::No floating tags are newer for ${CANDIDATE}; nothing to promote."
            exit 0
          fi

          promote_registry() {
            local image="$1"
            local args=()
            local t
            for t in "${TAGS[@]}"; do
              args+=(--tag "${image}:${t}")
            done
            echo "::notice::Promoting [${TAGS[*]}] -> ${image}@${DIGEST}"
            docker buildx imagetools create "${args[@]}" "${image}@${DIGEST}"
          }

          promote_registry "$GHCR_IMAGE"
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            promote_registry "$DOCKERHUB_IMAGE"
          fi

          echo "::notice::Floating tags promoted for ${CANDIDATE}: ${TAGS[*]}"
