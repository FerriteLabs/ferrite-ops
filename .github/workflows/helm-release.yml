name: Helm Chart Release

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
  pull_request:
    paths:
      - 'charts/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            echo "==> Linting $chart"
            helm lint "$chart" --strict
          done

      - name: Template validation
        run: |
          for chart in charts/*/; do
            echo "==> Templating $chart"
            helm template test "$chart" --values "$chart/values.yaml" > /dev/null
          done

      - name: Template HA validation
        run: |
          if [ -f charts/ferrite/values-ha.yaml ]; then
            helm template test charts/ferrite/ \
              --values charts/ferrite/values.yaml \
              --values charts/ferrite/values-ha.yaml > /dev/null
            echo "HA values template validation passed"
          fi

  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
